name: Build, test and publish DOOM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Compile pinned engine in pinned toolchain
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e EM_CACHE=/src/build/emscripten-cache -v "$PWD:/src" -w /src \
            emscripten/emsdk@sha256:bbe90e2b00acbd1a9596087d88305029f383de1eb71c0cdb20f4e19647265450 \
            bash scripts/build-engine.sh
      - run: python3 scripts/fetch-content.py
      - run: python3 scripts/fetch-dependency-sources.py
      - name: Native rotation tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror tests/turn_test.c engine/turn.c -lm -o /tmp/turn-test
          /tmp/turn-test
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
