name: Build, test and publish DOOM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  # A newer push contains the prior changes; only its validated artifact should deploy.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Compile pinned Classic, High and Modern GPU engines
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e EM_CACHE=/src/build/emscripten-cache -v "$PWD:/src" -w /src \
            emscripten/emsdk@sha256:bbe90e2b00acbd1a9596087d88305029f383de1eb71c0cdb20f4e19647265450 \
            bash scripts/build-engine.sh
      - run: python3 scripts/fetch-content.py
      - run: python3 scripts/fetch-modern-content.py
      - run: python3 scripts/fetch-dependency-sources.py
      - name: Native rotation and event queue tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror tests/turn_test.c engine/turn.c -lm -o /tmp/turn-test
          /tmp/turn-test
          cc -std=c99 -Wall -Wextra -Werror -Ibuild/engine/src -Ibuild/wasm tests/event_queue_test.c build/engine/src/d_event.c -o /tmp/event-queue-classic
          /tmp/event-queue-classic Classic
          cc -std=c99 -Wall -Wextra -Werror -Ibuild/engine-high/src -Ibuild/wasm-high tests/event_queue_test.c build/engine-high/src/d_event.c -o /tmp/event-queue-high
          /tmp/event-queue-high High
      - run: npm test
      - run: npm run build
      - name: Install browser runtimes
        run: |
          # The Azure Ubuntu mirror downloaded 119 MB at 172 kB/s in CI.
          # Keep Ubuntu's signed packages and use its official HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http[s]\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium webkit
      - name: Browser integration tests
        run: npm run test:e2e -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: build/browser-results.json
      - name: Preserve browser results and visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-validation
          path: |
            build/browser-results.json
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
